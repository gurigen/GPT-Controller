[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-controller-runtime"
version = "4.1.0rc2"
description = "GPT Controller: review-candidate Git-mediated remote execution runtime controlled by ChatGPT"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<52", "psutil>=5.9,<8"]

[project.optional-dependencies]
browser = ["playwright>=1.46"]
windows-ui = ["pywinauto>=0.6.9; sys_platform == 'win32'", "Pillow>=10"]
all = ["playwright>=1.46", "pywinauto>=0.6.9; sys_platform == 'win32'", "Pillow>=10", "pytest>=8"]

[project.scripts]
gpt-controller-admin = "agent_runtime.hardening.cli:main"
gpt-controller = "agent_runtime.cli:main"
gpt-controller-interactive = "agent_runtime.interactive_host:main"
q-agent-v4 = "agent_runtime.cli:main"
q-agent-v4-interactive = "agent_runtime.interactive_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
